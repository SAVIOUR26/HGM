name: Build Windows Installer

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build Electron
        run: npm run build:electron

      - name: Build Windows installer
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List release files
        run: |
          echo "Release directory contents:"
          dir release

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: HGM-POS-Windows-Installer
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: HGM-POS-Windows-Portable
          path: release/win-unpacked/**/*
          retention-days: 30
          if-no-files-found: warn

      - name: Get installer info
        if: success()
        shell: pwsh
        run: |
          $exeFile = Get-ChildItem -Path release -Filter *.exe | Select-Object -First 1
          if ($exeFile) {
            $size = [math]::Round($exeFile.Length / 1MB, 2)
            echo "✅ Installer created: $($exeFile.Name)"
            echo "📦 Size: $size MB"
            echo "📁 Location: release/$($exeFile.Name)"
          }

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: build-windows
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: HGM-POS-Windows-Installer
          path: ./downloads

      - name: Create build summary
        run: |
          echo "## 🎉 HGM POS Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Windows Installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "./downloads" ]; then
            echo "✅ **Build Status:** Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Files created:**" >> $GITHUB_STEP_SUMMARY
            ls -lh ./downloads | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Download:** Go to 'Actions' tab > Select this workflow run > Download artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the installer artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the ZIP file" >> $GITHUB_STEP_SUMMARY
          echo "3. Run \`HGM-POS-Setup-1.0.0.exe\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Follow the installation wizard" >> $GITHUB_STEP_SUMMARY
          echo "5. Launch 'HGM POS System' from desktop or start menu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Default Credentials" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Username: \`admin\`" >> $GITHUB_STEP_SUMMARY
          echo "- Password: \`admin123\`" >> $GITHUB_STEP_SUMMARY
