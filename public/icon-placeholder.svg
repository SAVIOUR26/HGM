<svg width="256" height="256" xmlns="http://www.w3.org/2000/svg">
  <!-- HGM POS System Icon Placeholder -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#grad1)"/>

  <!-- HGM Text -->
  <text x="128" y="110" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">HGM</text>

  <!-- POS Text -->
  <text x="128" y="160" font-family="Arial, sans-serif" font-size="36" font-weight="normal" fill="white" text-anchor="middle" opacity="0.9">POS</text>

  <!-- Small cash register icon -->
  <rect x="90" y="175" width="76" height="50" rx="4" fill="white" opacity="0.3"/>
  <rect x="100" y="185" width="56" height="30" rx="2" fill="white" opacity="0.5"/>
  <circle cx="120" r="3" cy="210" fill="white"/>
  <circle cx="135" r="3" cy="210" fill="white"/>
</svg>
