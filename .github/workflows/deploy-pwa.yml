name: Deploy PWA to DirectAdmin

on:
  push:
    branches:
      - claude/pwa-php-019jxEz7iqNJ1mRbBtdqqP4F
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to DirectAdmin via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Create config.php from secrets
        run: |
          cat > api/config/config.php << 'EOF'
          <?php
          /**
           * Configuration File
           * Auto-generated by GitHub Actions
           */

          // Database Configuration
          define('DB_HOST', '${{ secrets.DB_HOST }}');
          define('DB_NAME', '${{ secrets.DB_NAME }}');
          define('DB_USER', '${{ secrets.DB_USER }}');
          define('DB_PASS', '${{ secrets.DB_PASS }}');

          // JWT Secret Key
          define('JWT_SECRET', '${{ secrets.JWT_SECRET }}');

          // Application Settings
          define('APP_NAME', 'HGM POS System');
          define('APP_VERSION', '2.0.0-PWA');
          define('APP_DEBUG', false);

          // Timezone
          date_default_timezone_set('Africa/Kampala');
          EOF

      - name: Prepare deployment files
        run: |
          # Create deployment directory
          mkdir -p deploy

          # Copy API files
          cp -r api deploy/

          # Copy frontend build
          cp -r dist/web/* deploy/

          # Copy PWA files
          cp public/manifest.json deploy/
          cp public/sw.js deploy/
          cp public/icon.png deploy/

          # List files to be deployed
          echo "Files to be deployed:"
          ls -la deploy/

      - name: Deploy to DirectAdmin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./domains/wh175143.ispot.cc/public_html/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/database.sql

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Site URL: https://hideout.wh175143.ispot.cc"
          echo "API Health: https://hideout.wh175143.ispot.cc/api/health"
          echo ""
          echo "Next steps:"
          echo "1. Import database.sql via phpMyAdmin (one-time only)"
          echo "2. Test login: admin / admin123"
          echo "3. Change admin password immediately"
          echo "4. Update business settings"
